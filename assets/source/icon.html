<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hybrid Delivery — icon</title>
<link rel="stylesheet" href="identity.css">
<style>
	/*
	 * The icon is rendered at 128 and 256. At 128 the arcs must still separate,
	 * so weights are expressed in viewBox units and scale with the tile rather
	 * than being tuned for one size and mushing at the other.
	 */
	html, body { width: 100%; height: 100%; }
	body { display: grid; place-items: center; background: transparent; }
	svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
	<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hybrid Delivery">
		<defs>
			<linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0" stop-color="#16203040"/>
				<stop offset="0" stop-color="#141d2b"/>
				<stop offset="1" stop-color="#070c15"/>
			</linearGradient>
			<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0" stop-color="#26e0b4" stop-opacity="0.5"/>
				<stop offset="1" stop-color="#6b8cff" stop-opacity="0.16"/>
			</linearGradient>
		</defs>

		<rect width="256" height="256" rx="58" fill="url(#field)"/>
		<rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

		<!-- Propagation: widest arc faintest, so the eye travels outward. -->
		<g fill="none" stroke="#26e0b4" stroke-linecap="round">
			<path d="M99 58 A 78 78 0 0 1 99 198" stroke-width="14" opacity="0.22"/>
			<path d="M95 80 A 54 54 0 0 1 95 176" stroke-width="14" opacity="0.48"/>
			<path d="M91 102 A 31 31 0 0 1 91 154" stroke-width="14" opacity="0.95"/>
		</g>

		<!-- The canonical copy every edge derives from. -->
		<circle cx="73" cy="128" r="22" fill="#26e0b4"/>
		<circle cx="73" cy="128" r="8.5" fill="#04140f"/>
	</svg>
</body>
</html>
